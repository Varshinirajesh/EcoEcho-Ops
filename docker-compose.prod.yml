# Production deploy variant of docker-compose.yml.
#
# Differences from the local dev file: internal services (mlflow, minio,
# inference-api, buoy-simulator, prometheus, grafana, dashboard-api) publish
# no ports to the host — only reachable over the internal ecoecho-net
# network. Caddy is the one thing exposed publicly (80/443), reverse-proxying
# to dashboard-frontend, which itself proxies /api/ to dashboard-api
# (see nginx.conf). Admin UIs (Grafana/MLflow/MinIO console) are reached via
# an SSH tunnel, not a public URL — see DEPLOY.md.
#
# Usage on the VM: docker compose -f docker-compose.prod.yml up -d --build

networks:
  ecoecho-net:
    driver: bridge
    name: ecoecho-net

services:
  mlflow:
    build:
      context: .
      dockerfile: services/mlflow/Dockerfile
    volumes:
      - ./storage/mlflow:/mlflow
    networks: [ecoecho-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    env_file: .env
    volumes:
      - ./storage/minio:/data
    networks: [ecoecho-net]
    restart: unless-stopped

  inference-api:
    build:
      context: .
      dockerfile: services/inference-api/Dockerfile
    env_file: .env
    volumes:
      - ./models:/app/models:ro
    networks: [ecoecho-net]
    restart: unless-stopped
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  buoy-simulator:
    build:
      context: .
      dockerfile: services/buoy-simulator/Dockerfile
    env_file: .env
    environment:
      INFERENCE_API_URL: http://inference-api:8000/predict
    volumes:
      - ./data/audio_stream:/app/data/audio_stream:ro
      - ./cache/uplink:/app/cache/uplink
    networks: [ecoecho-net]
    restart: unless-stopped
    depends_on:
      inference-api:
        condition: service_healthy
      minio:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.53.5
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [ecoecho-net]
    restart: unless-stopped
    depends_on:
      - inference-api
      - buoy-simulator

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./storage/grafana:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks: [ecoecho-net]
    restart: unless-stopped
    depends_on:
      - prometheus

  dashboard-api:
    build:
      context: .
      dockerfile: services/dashboard-api/Dockerfile
    env_file: .env
    networks: [ecoecho-net]
    restart: unless-stopped
    depends_on:
      - prometheus
      - mlflow
      - buoy-simulator

  dashboard-frontend:
    build:
      context: .
      dockerfile: services/dashboard-frontend/Dockerfile
    networks: [ecoecho-net]
    restart: unless-stopped
    depends_on:
      - dashboard-api

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [ecoecho-net]
    restart: unless-stopped
    depends_on:
      - dashboard-frontend

volumes:
  caddy-data:
